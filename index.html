<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WMS А2 — Товары</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #F4F6FB;
      --surface:   #FFFFFF;
      --border:    #E2E8F0;
      --text:      #1E293B;
      --text-muted:#64748B;
      --radius:    12px;
      --shadow:    0 1px 4px rgba(0,0,0,.06);

      --blue-bg:   #EBF3FF; --blue-txt:  #2563EB;
      --green-bg:  #ECFDF5; --green-txt: #059669;
      --amber-bg:  #FFF7ED; --amber-txt: #D97706;
      --red-bg:    #FFF1F1; --red-txt:   #DC2626;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ─── top bar ─── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      height: 56px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -.3px;
      color: var(--text);
    }
    .logo span { color: #6366F1; }
    .divider-v {
      width: 1px;
      height: 20px;
      background: var(--border);
    }
    .section-label {
      font-size: 13px;
      color: var(--text-muted);
    }
    .section-label strong {
      color: var(--text);
      font-weight: 600;
    }

    /* ─── main ─── */
    main { padding: 28px 24px; max-width: 960px; margin: 0 auto; }

    .toolbar {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .search-wrap {
      position: relative;
      flex: 1;
      min-width: 220px;
    }
    .search-wrap svg {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }
    input[type="search"] {
      width: 100%;
      padding: 9px 12px 9px 36px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      font-size: 14px;
      color: var(--text);
      outline: none;
      transition: border-color .15s;
    }
    input[type="search"]:focus { border-color: #6366F1; box-shadow: 0 0 0 3px rgba(99,102,241,.12); }
    input[type="search"]::placeholder { color: var(--text-muted); }

    select {
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      font-size: 14px;
      color: var(--text);
      outline: none;
      cursor: pointer;
      transition: border-color .15s;
    }
    select:focus { border-color: #6366F1; box-shadow: 0 0 0 3px rgba(99,102,241,.12); }

    /* ─── table card ─── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .stat-row {
      display: flex;
      gap: 2px;
      border-bottom: 1px solid var(--border);
    }
    .stat {
      flex: 1;
      padding: 14px 18px;
      border-right: 1px solid var(--border);
    }
    .stat:last-child { border-right: none; }
    .stat-val { font-size: 22px; font-weight: 700; color: var(--text); }
    .stat-lbl { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

    table {
      width: 100%;
      border-collapse: collapse;
    }
    thead th {
      padding: 12px 16px;
      text-align: left;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: .05em;
      background: #F8FAFC;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background .1s;
      cursor: pointer;
    }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #F8FAFC; }
    td {
      padding: 14px 16px;
      vertical-align: middle;
    }
    .sku {
      font-family: monospace;
      font-size: 12px;
      background: #F1F5F9;
      padding: 3px 7px;
      border-radius: 6px;
      color: #475569;
    }
    .cell-code {
      font-size: 13px;
      color: var(--text-muted);
    }

    /* ─── status badges ─── */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
    }
    .badge-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .status-ready  { background: var(--green-bg);  color: var(--green-txt); }
    .status-store  { background: var(--blue-bg);   color: var(--blue-txt);  }
    .status-assem  { background: var(--amber-bg);  color: var(--amber-txt); }
    .status-write  { background: var(--red-bg);    color: var(--red-txt);   }
    .status-ready .badge-dot  { background: var(--green-txt); }
    .status-store  .badge-dot { background: var(--blue-txt);  }
    .status-assem  .badge-dot { background: var(--amber-txt); }
    .status-write  .badge-dot { background: var(--red-txt);   }

    /* ─── open btn ─── */
    .btn-open {
      padding: 6px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      font-size: 13px;
      color: var(--text);
      cursor: pointer;
      transition: background .12s, border-color .12s;
      white-space: nowrap;
    }
    .btn-open:hover { background: #F1F5F9; border-color: #CBD5E1; }

    .empty {
      padding: 48px 24px;
      text-align: center;
      color: var(--text-muted);
    }

    /* ─── modal overlay ─── */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15,23,42,.35);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .overlay.open { display: flex; }
    .modal {
      background: var(--surface);
      border-radius: 18px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 20px 60px rgba(0,0,0,.16);
      animation: popIn .18s ease;
    }
    @keyframes popIn {
      from { transform: scale(.96); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }
    .modal-header {
      padding: 20px 22px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .modal-title { font-size: 16px; font-weight: 700; }
    .modal-close {
      width: 32px; height: 32px;
      border-radius: 8px;
      border: none;
      background: none;
      font-size: 20px;
      cursor: pointer;
      color: var(--text-muted);
      display: flex; align-items: center; justify-content: center;
      transition: background .1s;
    }
    .modal-close:hover { background: #F1F5F9; }
    .modal-body { padding: 20px 22px; }
    .field-row {
      display: flex;
      justify-content: space-between;
      padding: 9px 0;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }
    .field-row:last-child { border-bottom: none; }
    .field-row dt { color: var(--text-muted); }
    .field-row dd { font-weight: 500; }
  </style>
</head>
<body>

<header>
  <div class="logo">WMS <span>А2</span></div>
  <div class="divider-v"></div>
  <div class="section-label">Раздел: <strong>Товары</strong></div>
</header>

<main>
  <div class="toolbar">
    <div class="search-wrap">
      <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      <input type="search" id="searchInput" placeholder="Поиск по товару или SKU" autocomplete="off" maxlength="100" />
    </div>
    <select id="statusFilter" aria-label="Фильтр по статусу">
      <option value="">Все статусы</option>
      <option value="ready">Готов к отгрузке</option>
      <option value="store">На хранении</option>
      <option value="assem">На сборке</option>
      <option value="write">Списан</option>
    </select>
  </div>

  <div class="card">
    <div class="stat-row" id="stats"></div>
    <table>
      <thead>
        <tr>
          <th>SKU</th>
          <th>Товар</th>
          <th>Ячейка</th>
          <th>Статус</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
    <div class="empty" id="emptyMsg" style="display:none">Товары не найдены</div>
  </div>
</main>

<!-- modal -->
<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="modalTitle"></span>
      <button class="modal-close" id="modalClose" aria-label="Закрыть">×</button>
    </div>
    <div class="modal-body">
      <dl id="modalBody"></dl>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* ── data ── */
  const ITEMS = [
    { id: 1, sku: 'WB-001', name: 'Футболка базовая',   cell: 'A-14-02', status: 'ready' },
    { id: 2, sku: 'WB-002', name: 'Кроссовки',          cell: 'B-03-01', status: 'store' },
    { id: 3, sku: 'WB-003', name: 'Рюкзак',             cell: 'B-05-02', status: 'assem' },
    { id: 4, sku: 'WB-004', name: 'Кепка',              cell: 'A-12-04', status: 'write' },
    { id: 5, sku: 'WB-005', name: 'Джинсы slim fit',    cell: 'C-08-01', status: 'store' },
    { id: 6, sku: 'WB-006', name: 'Куртка зимняя',      cell: 'D-02-03', status: 'ready' },
    { id: 7, sku: 'WB-007', name: 'Носки спортивные',   cell: 'A-01-01', status: 'assem' },
  ];

  const STATUS_MAP = {
    ready: { label: 'Готов к отгрузке', cls: 'status-ready' },
    store: { label: 'На хранении',      cls: 'status-store' },
    assem: { label: 'На сборке',        cls: 'status-assem' },
    write: { label: 'Списан',           cls: 'status-write' },
  };

  /* ── sanitize ── */
  function esc(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  /* ── state ── */
  let query = '';
  let statusFilter = '';

  function filtered() {
    const q = query.trim().toLowerCase();
    return ITEMS.filter(item => {
      const matchQ = !q ||
        item.name.toLowerCase().includes(q) ||
        item.sku.toLowerCase().includes(q);
      const matchS = !statusFilter || item.status === statusFilter;
      return matchQ && matchS;
    });
  }

  /* ── stats ── */
  function renderStats() {
    const counts = { ready: 0, store: 0, assem: 0, write: 0 };
    ITEMS.forEach(i => counts[i.status]++);
    const statsEl = document.getElementById('stats');
    statsEl.innerHTML = Object.entries(counts).map(([k, v]) => {
      const s = STATUS_MAP[k];
      return `<div class="stat">
        <div class="stat-val">${esc(String(v))}</div>
        <div class="stat-lbl">${esc(s.label)}</div>
      </div>`;
    }).join('');
  }

  /* ── table ── */
  function renderTable() {
    const rows = filtered();
    const tbody = document.getElementById('tableBody');
    const empty = document.getElementById('emptyMsg');

    if (!rows.length) {
      tbody.innerHTML = '';
      empty.style.display = 'block';
      return;
    }
    empty.style.display = 'none';
    tbody.innerHTML = rows.map(item => {
      const s = STATUS_MAP[item.status];
      return `<tr data-id="${esc(String(item.id))}">
        <td><span class="sku">${esc(item.sku)}</span></td>
        <td>${esc(item.name)}</td>
        <td><span class="cell-code">${esc(item.cell)}</span></td>
        <td>
          <span class="badge ${esc(s.cls)}">
            <span class="badge-dot" aria-hidden="true"></span>
            ${esc(s.label)}
          </span>
        </td>
        <td>
          <button class="btn-open" data-open="${esc(String(item.id))}">Открыть</button>
        </td>
      </tr>`;
    }).join('');
  }

  /* ── modal ── */
  function openModal(id) {
    const item = ITEMS.find(i => i.id === Number(id));
    if (!item) return;
    const s = STATUS_MAP[item.status];
    document.getElementById('modalTitle').textContent = item.name;
    document.getElementById('modalBody').innerHTML = [
      ['SKU',     item.sku],
      ['Ячейка',  item.cell],
      ['Статус',  s.label],
    ].map(([k, v]) =>
      `<div class="field-row"><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`
    ).join('');
    document.getElementById('overlay').classList.add('open');
    document.getElementById('modalClose').focus();
  }

  function closeModal() {
    document.getElementById('overlay').classList.remove('open');
  }

  /* ── events ── */
  document.getElementById('searchInput').addEventListener('input', function () {
    query = this.value.slice(0, 100); // length cap
    renderTable();
  });

  document.getElementById('statusFilter').addEventListener('change', function () {
    statusFilter = this.value;
    renderTable();
  });

  document.getElementById('tableBody').addEventListener('click', function (e) {
    const btn = e.target.closest('[data-open]');
    if (btn) { openModal(btn.dataset.open); return; }
    const row = e.target.closest('tr[data-id]');
    if (row) openModal(row.dataset.id);
  });

  document.getElementById('modalClose').addEventListener('click', closeModal);

  document.getElementById('overlay').addEventListener('click', function (e) {
    if (e.target === this) closeModal();
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeModal();
  });

  /* ── init ── */
  renderStats();
  renderTable();
})();
</script>
</body>
</html>
